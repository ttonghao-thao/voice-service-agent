map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format privacy '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=portal_limit:10m rate=10r/s;
server {
    listen 8087 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    access_log /var/log/nginx/access.log privacy;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    # Ant Design uses CSS-in-JS. Scripts remain same-origin; no inline script execution.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        limit_req zone=portal_limit burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 15s;
        # No query-string logging: websocket tickets and session credentials are sensitive.
        access_log off;
    }
    location /health/ { proxy_pass http://api:8000; access_log off; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
