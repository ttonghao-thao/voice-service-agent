name: voice-service-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: voice_service
      POSTGRES_USER: voice_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_service -d voice_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    logging: *default-logging

  livekit:
    profiles: [sophon]
    image: livekit/livekit-server:v1.13.11
    environment:
      LIVEKIT_RTC_INTERFACE: ${LIVEKIT_RTC_INTERFACE:-}
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: "${LIVEKIT_NODE_IP:-}"
          use_external_ip: false
          interfaces:
            includes: ${LIVEKIT_RTC_INTERFACE:+["${LIVEKIT_RTC_INTERFACE}"]}
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
          db: 1
        keys:
          "${LIVEKIT_API_KEY:-}": "${LIVEKIT_API_SECRET:-}"
    ports:
      - "0.0.0.0:7881:7881/tcp"
      - "0.0.0.0:7882:7882/udp"
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$${LIVEKIT_RTC_INTERFACE}" ] && [ ! -r "/sys/class/net/$${LIVEKIT_RTC_INTERFACE}/ifindex" ]; then
            echo "LIVEKIT_RTC_INTERFACE '$${LIVEKIT_RTC_INTERFACE}' was not found in the LiveKit container." >&2
            exit 1
          fi
          wget -q -O /dev/null http://127.0.0.1:7880/
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [data, app, edge]
    logging: *default-logging

  migrate:
    image: voice-service-agent-api:${IMAGE_TAG:?Set the prebuilt IMAGE_TAG in .env}
    pull_policy: never
    env_file: ${DEPLOY_ENV_FILE:-../.env}
    environment: &application-environment
      AUTO_CREATE_SCHEMA: "false"
      AUTH_MODE: validation
      AGENT_PROVIDER: ${AGENT_PROVIDER:-disabled}
      AGENT_DEADLINE_MS: ${AGENT_DEADLINE_MS:-60000}
      QA_EXECUTION_MODE: ${QA_EXECUTION_MODE:-dual_tools}
      QA_ANSWER_POLICY: ${QA_ANSWER_POLICY:-general_qa}
      QA_EXTERNAL_FALLBACK_ENABLED: ${QA_EXTERNAL_FALLBACK_ENABLED:-false}
      QA_MAX_RETRIEVAL_CALLS: ${QA_MAX_RETRIEVAL_CALLS:-1}
      QA_PROVIDER_ANSWER_TIMEOUT_MS: ${QA_PROVIDER_ANSWER_TIMEOUT_MS:-30000}
      CUEKB_MODE: real
      KNOWLEDGE_BASE_IDS: ${KNOWLEDGE_BASE_IDS:-}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-qweather}
      WEATHER_MODE: ${WEATHER_MODE:-real}
      ENABLED_TOOLS: ${ENABLED_TOOLS:-search_knowledge,weather,web_search}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-sophon_live}
      DELEGATION_ROUTER_PROVIDER: ${DELEGATION_ROUTER_PROVIDER:-openai_compatible}
      DATABASE_URL: postgresql+asyncpg://voice_service:${POSTGRES_PASSWORD}@postgres/voice_service
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    logging: *default-logging

  api:
    image: voice-service-agent-api:${IMAGE_TAG:?Set the prebuilt IMAGE_TAG in .env}
    pull_policy: never
    env_file: ${DEPLOY_ENV_FILE:-../.env}
    environment:
      <<: *application-environment
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the test HTTPS origin in .env}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      livekit: {condition: service_healthy, required: false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data, app, egress]
    logging: *default-logging

  web:
    image: voice-service-agent-web:${IMAGE_TAG:?Set the prebuilt IMAGE_TAG in .env}
    pull_policy: never
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-sophon_live}
      NGINX_ENVSUBST_FILTER: '^(LIVEKIT_URL|VOICE_PROVIDER)$'
    ports:
      - "0.0.0.0:8087:8087"
      - "0.0.0.0:7880:7880"
    volumes:
      - "${WEB_TLS_CERT_FILE:?Set the TLS certificate path in .env}:/etc/nginx/tls/tls.crt:ro"
      - "${WEB_TLS_KEY_FILE:?Set the TLS private key path in .env}:/etc/nginx/tls/tls.key:ro"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off --no-check-certificate -q -O /dev/null https://127.0.0.1:8087/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [app, edge]
    logging: *default-logging

networks:
  data:
    internal: true
  app:
    internal: true
  edge:
  egress:

volumes:
  postgres-data:
  redis-data:
