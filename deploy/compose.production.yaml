name: voice-service-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: voice_service
      POSTGRES_USER: voice_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_service -d voice_service"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    logging: *default-logging

  migrate:
    image: voice-service-agent-api:${IMAGE_TAG:?Set the prebuilt IMAGE_TAG in .env}
    pull_policy: never
    env_file: ${DEPLOY_ENV_FILE:-../.env}
    environment: &application-environment
      AUTO_CREATE_SCHEMA: "false"
      AUTH_MODE: validation
      CUEKB_MODE: real
      ENABLED_TOOLS: search_knowledge
      VOICE_PROVIDER: nvidia
      DATABASE_URL: postgresql+asyncpg://voice_service:${POSTGRES_PASSWORD}@postgres/voice_service
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    logging: *default-logging

  api:
    image: voice-service-agent-api:${IMAGE_TAG:?Set the prebuilt IMAGE_TAG in .env}
    pull_policy: never
    env_file: ${DEPLOY_ENV_FILE:-../.env}
    environment:
      <<: *application-environment
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the test HTTP origin in .env}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [data, app, egress]
    logging: *default-logging

  web:
    image: voice-service-agent-web:${IMAGE_TAG:?Set the prebuilt IMAGE_TAG in .env}
    pull_policy: never
    ports:
      - "0.0.0.0:8087:8087"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8087/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [app, edge]
    logging: *default-logging

networks:
  data:
    internal: true
  app:
    internal: true
  edge:
  egress:

volumes:
  postgres-data:
  redis-data:
