openapi: 3.1.0
info:
  title: CueKB Search Contract Used by Voice Service Agent
  version: dac382e282f12ae1c1b89366d5c058725d9f13c6
paths:
  /v2/search:
    post:
      operationId: searchKnowledge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./cuekb-search-request.schema.json
      responses:
        "200":
          description: CueKB retrieval result
          content:
            application/json:
              schema:
                $ref: ./cuekb-search-response.schema.json
        "401": {description: Invalid service API key}
        "403": {description: Service principal lacks KB access}
        "409": {description: V2 index or model configuration requires attention}
        "422": {description: Request contract violation}
        "429": {description: Rate limited}
        "503": {description: Dependency or capacity unavailable}
        "504": {description: CueKB search deadline exceeded}
        "5XX": {description: CueKB service failure}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
