# Phase 1: one native VoiceChat tool. Executable code remains trusted.
# Apply this file to an existing persisted catalog with configure_native_cuekb.py.
tools:
  - name: search_cuekb
    implementation: search_cuekb
    description: >-
      Search the authorized CueKB knowledge base for product-specific or company-specific
      information. Use this tool for questions about product features, specifications,
      user manuals, installation, configuration, troubleshooting, error codes, firmware
      versions, and documented procedures. Also use it for follow-up questions about
      products discussed earlier in the conversation. Do not use this tool for greetings,
      casual conversation, jokes, general science, general technology concepts, or common
      knowledge that does not depend on product documentation. Never invent product-specific
      facts when documentation is required. If essential product information cannot be
      resolved from trusted conversation context, ask the user to clarify it.
    ack_messages:
      - Let me check the documentation.
    examples:
      - query: What are the documented connection limits for Product AX firmware version 2?
    output_description: >-
      Returns short, traceable evidence excerpts for VoiceChat to answer from, or an explicit
      search failure, insufficient-evidence result or clarification. A failed or limited
      search does not prove that a product feature or document does not exist.
