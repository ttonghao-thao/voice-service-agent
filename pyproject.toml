[project]
name = "voice-service-agent"
version = "0.1.0"
description = "Chinese service portal with an evidence-backed Agents SDK runtime and VoiceChat bridge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.15,<2", "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1",
  "httpx>=0.28,<1", "websockets>=15,<16", "openai-agents>=0.2,<1",
  "redis>=6,<7", "pyjwt[crypto]>=2.10,<3", "pyyaml>=6,<7", "jsonschema>=4.23,<5"
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
testpaths = ["tests/contract", "tests/integration"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
